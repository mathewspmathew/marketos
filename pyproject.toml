[project]
name = "marketos"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.0",
    "celery[redis]>=5.0",
    "firecrawl-py",
    "groq",
    "google-cloud-storage",
    "google-cloud-aiplatform",
    "google-genai",
    "pydantic",
    "python-dotenv",
    "requests",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic-ai>=0.0.13",
    "respx>=0.21",
    "sse-starlette>=2.1",
    "uvicorn[standard]>=0.30",
    "pillow>=12.2.0",
    "lightgbm>=4.5",
    "numpy>=2.0",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "logfire>=4.33.0",
    "structlog>=24.1",
    "flower>=2.0.1",
    "pyright>=1.1.410",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

