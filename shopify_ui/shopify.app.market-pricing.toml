# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "a91fe74ac239d442db88d3dc79740b1c"
name = "market-pricing"
application_url = "https://example.com"
embedded = true

[build]
automatically_update_urls_on_dev = true
include_config_on_deploy = true

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  topics = ["products/create"]
  uri = "/webhooks/products/create"

  [[webhooks.subscriptions]]
  topics = ["products/update"]
  uri = "/webhooks/products/update"

  [[webhooks.subscriptions]]
  topics = ["products/delete"]
  uri = "/webhooks/products/delete"

  # orders/create is gated by Shopify's protected-customer-data approval.
  # Until that approval lands, SalesAggregate is populated by the daily
  # Admin API refresh (shopify_sync.refresh_all_sales_aggregates) instead.
  # [[webhooks.subscriptions]]
  # topics = ["orders/create"]
  # uri = "/webhooks/orders/create"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_analytics,read_inventory,read_orders,read_product_listings,read_products,write_inventory,write_product_listings,write_products"

[auth]
redirect_urls = [ "https://example.com/api/auth" ]
