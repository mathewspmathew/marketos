name: marketos

services:
  redis:
    image: redis:7-alpine
    container_name: marketos_redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:  
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  scraper-worker:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: scraper_worker
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379/0
      - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY}
      # rescrape_url runs inline here (not via extraction_queue) and calls
      # extract_with_groq directly — needs its own Groq key.
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_API_KEY_BACKUP=${GROQ_API_KEY_BACKUP}
      - GCS_IMAGE_BUCKET=${GCS_IMAGE_BUCKET}
      - GCS_MARKDOWN_BUCKET=${GCS_MARKDOWN_BUCKET}
      - GOOGLE_CLOUD_PROJECT=${VERTEX_PROJECT}
      - GOOGLE_APPLICATION_CREDENTIALS=/root/.config/gcloud/application_default_credentials.json
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./services:/app/services
      - ~/.config/gcloud:/root/.config/gcloud:ro
    command: ["uv", "run", "celery", "-A", "services.common.celery_app", "worker", "-Q", "scraping_queue", "-n", "scraper-worker@%h", "--concurrency=2", "--loglevel=info"]

  extraction-worker:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: extraction_worker
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379/0
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_API_KEY_BACKUP=${GROQ_API_KEY_BACKUP}
      - GCS_IMAGE_BUCKET=${GCS_IMAGE_BUCKET}
      - GCS_MARKDOWN_BUCKET=${GCS_MARKDOWN_BUCKET}
      - GOOGLE_CLOUD_PROJECT=${VERTEX_PROJECT}
      - GOOGLE_APPLICATION_CREDENTIALS=/root/.config/gcloud/application_default_credentials.json
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./services:/app/services
      - ~/.config/gcloud:/root/.config/gcloud:ro
    # concurrency=1 + rate_limit='3/m' = 3 Groq calls/min = ~7800 tokens/min
    # safely under the free-tier 14400 TPM limit for llama-3.1-8b-instant
    command: ["uv", "run", "celery", "-A", "services.common.celery_app", "worker", "-Q", "extraction_queue", "-n", "extraction-worker@%h", "--concurrency=1", "--loglevel=info"]

  scheduler-worker:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: scheduler_worker
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./services:/app/services
    command: ["uv", "run", "celery", "-A", "services.common.celery_app", "worker", "-Q", "scheduler_queue", "--concurrency=1", "--loglevel=info"]

  discovery-worker:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: discovery_worker
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379/0
      - SERPER_API_KEY=${SERPER_API_KEY}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./services:/app/services
    command: ["uv", "run", "celery", "-A", "services.common.celery_app", "worker", "-Q", "discovery_queue", "-n", "discovery-worker@%h", "--concurrency=2", "--loglevel=info"]

  semantic-worker:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: semantic_worker
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379/0
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_API_KEY_BACKUP=${GROQ_API_KEY_BACKUP}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./services:/app/services
    # concurrency=1 + rate_limit='3/m' keeps Groq TPM usage separate from extraction
    command: ["uv", "run", "celery", "-A", "services.common.celery_app", "worker", "-Q", "semantic_queue", "-n", "semantic-worker@%h", "--concurrency=1", "--loglevel=info"]

  # Dedicated worker for Shopify variant semantic generation. Uses a separate
  # Groq API key (GROQ_API_KEY_SHOPIFY) so its TPM budget is independent from
  # the competitor-scraping path. Without this split, a flood of Shopify
  # products starves ScrapedVariant semantic generation on the shared queue.
  shopify-semantic-worker:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: shopify_semantic_worker
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379/0
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_API_KEY_BACKUP=${GROQ_API_KEY_BACKUP}
      - GROQ_API_KEY_SHOPIFY=${GROQ_API_KEY_SHOPIFY}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./services:/app/services
    command: ["uv", "run", "celery", "-A", "services.common.celery_app", "worker", "-Q", "shopify_semantic_queue", "-n", "shopify-semantic-worker@%h", "--concurrency=1", "--loglevel=info"]

  embedding-worker:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: embedding_worker
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379/0
      - VERTEX_PROJECT=${VERTEX_PROJECT}
      - VERTEX_LOCATION=${VERTEX_LOCATION}
      - GOOGLE_CLOUD_PROJECT=${VERTEX_PROJECT}
      - GOOGLE_APPLICATION_CREDENTIALS=/root/.config/gcloud/application_default_credentials.json
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./services:/app/services
      - ~/.config/gcloud:/root/.config/gcloud:ro
    command: ["uv", "run", "celery", "-A", "services.common.celery_app", "worker", "-Q", "embedding_queue", "--concurrency=2", "--loglevel=info"]

  matcher-worker:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: matcher_worker
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./services:/app/services
    command: ["uv", "run", "celery", "-A", "services.common.celery_app", "worker", "-Q", "match_queue", "-n", "matcher-worker@%h", "--concurrency=2", "--loglevel=info"]

  # Single worker handles all dynamic-pricing queues — stats, pricing decisions,
  # Shopify sync (orders/inventory pulls), and Shopify write-back. Combined to
  # keep dev-laptop memory low; split into 4 workers in production for
  # independent scaling and rate-limit isolation.
  pricing-worker:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: pricing_worker
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379/0
      # Worker reaches the React Router app on the host via this hostname.
      # On Linux Docker, host.docker.internal needs the extra_hosts mapping below.
      - REACT_ROUTER_INTERNAL_URL=${REACT_ROUTER_INTERNAL_URL}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./services:/app/services
    command: ["uv", "run", "celery", "-A", "services.common.celery_app", "worker",
              "-Q", "stats_queue,pricing_queue,writer_queue,shopify_sync_queue",
              "-n", "pricing-worker@%h", "--concurrency=2", "--loglevel=info"]

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: celery_beat
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./services:/app/services
    command: ["uv", "run", "celery", "-A", "services.common.celery_app", "beat", "--loglevel=info"]

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: api_gateway
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./services:/app/services
    command: ["uv", "run", "uvicorn", "services.api_gateway.main:app", "--host", "0.0.0.0", "--port", "8000"]

  chatbot-svc:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: chatbot_svc
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379/0
      - GROQ_API_KEY=${GROQ_API_KEY}
      - CHATBOT_MODEL=${CHATBOT_MODEL:-groq:llama-3.3-70b-versatile}
      # Apply actions POST to the React Router app, which runs on the host
      # (npm run dev), not in this stack. Reach it via host.docker.internal —
      # same pattern as the workers (REACT_ROUTER_INTERNAL_URL / pricing_worker).
      - CHATBOT_RR_URL=${REACT_ROUTER_INTERNAL_URL:-http://host.docker.internal:3000}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN}
      # Query Studio grounding fetches real competitor brands via Serper when the
      # product has no already-scraped competitors.
      - SERPER_API_KEY=${SERPER_API_KEY}
      - VERTEX_PROJECT=${VERTEX_PROJECT}
      - VERTEX_LOCATION=${VERTEX_LOCATION}
      - GOOGLE_CLOUD_PROJECT=${VERTEX_PROJECT}
      - GOOGLE_APPLICATION_CREDENTIALS=/root/.config/gcloud/application_default_credentials.json
    ports:
      - "8088:8088"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./services:/app/services
      - ~/.config/gcloud:/root/.config/gcloud:ro
    command: ["uv", "run", "uvicorn", "services.chatbot_svc.app:app", "--host", "0.0.0.0", "--port", "8088"]

volumes:
  redis_data:
