# CI/CD pipeline: test on every push/PR, build+push images and deploy to
# the GCP VM on every push to main. See
# docs/superpowers/specs/2026-08-22-github-actions-gcp-cicd-design.md.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-js:
    name: Test JS (shopify_ui)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shopify_ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: shopify_ui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npx vitest run

  test-python:
    name: Test Python (services)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb-ha:pg16-all
        env:
          POSTGRES_USER: marketos
          POSTGRES_PASSWORD: marketos
          POSTGRES_DB: marketos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U marketos"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://marketos:marketos@localhost:5432/marketos
      DIRECT_DATABASE_URL: postgresql://marketos:marketos@localhost:5432/marketos
      INTERNAL_API_TOKEN: ci-dummy-token
      # services/chatbot_svc/agent.py raises at import time if unset — no
      # real API calls happen in tests (conftest mocks/blocks those), this
      # just needs to be present and well-formed for module import to succeed.
      CHATBOT_MODEL: groq:openai/gpt-oss-120b
      # services/chatbot_svc/deps.py reads this with os.environ[...] (hard
      # KeyError if unset). Never dereferenced for a real HTTP call anywhere
      # in app or test code — services/chatbot_svc/tests/test_agent_loop.py
      # already uses "http://test" as a Deps() placeholder, so this matches
      # that existing project convention rather than inventing a new one.
      CHATBOT_RR_URL: http://test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: shopify_ui/package-lock.json
      - name: Run Prisma migrations against the CI database
        working-directory: shopify_ui
        run: |
          npm ci
          # migrate deploy fails on a truly fresh database at
          # 20260618162752_fix_frequency_unit_daily_to_day, which drops an
          # ActivityEvent table that predates migration tracking (created
          # out-of-band, never had a corresponding CREATE migration — real
          # databases have always carried it forward, so this only breaks
          # on a genuinely empty DB like CI's). ActivityEvent is confirmed
          # dead: absent from schema.prisma and unreferenced in app code.
          # Never edit an already-applied migration's SQL (migrate deploy
          # checksum-verifies applied migrations; editing it would break
          # the next real deploy). Instead use Prisma's documented recovery
          # pattern: mark this one migration applied without running its
          # SQL (a no-op on a DB that never had the table), then continue.
          npx prisma migrate deploy || true
          npx prisma migrate resolve --applied 20260618162752_fix_frequency_unit_daily_to_day
          npx prisma migrate deploy
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - run: uv sync --frozen
      - run: uv run pytest

  build-and-push:
    name: Build and push images
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [test-js, test-python]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet
      - name: Build and push Python image
        run: |
          docker build -f Dockerfile.python \
            -t ${{ vars.ARTIFACT_REGISTRY }}/marketos-python:${{ github.sha }} \
            -t ${{ vars.ARTIFACT_REGISTRY }}/marketos-python:latest .
          docker push ${{ vars.ARTIFACT_REGISTRY }}/marketos-python:${{ github.sha }}
          docker push ${{ vars.ARTIFACT_REGISTRY }}/marketos-python:latest
      - name: Build and push web image
        run: |
          docker build \
            -t ${{ vars.ARTIFACT_REGISTRY }}/marketos-web:${{ github.sha }} \
            -t ${{ vars.ARTIFACT_REGISTRY }}/marketos-web:latest ./shopify_ui
          docker push ${{ vars.ARTIFACT_REGISTRY }}/marketos-web:${{ github.sha }}
          docker push ${{ vars.ARTIFACT_REGISTRY }}/marketos-web:latest

  deploy:
    name: Deploy to GCP VM
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      # The VM never needs a git checkout or GitHub credentials — only two
      # files from the repo matter to it (docker-compose.prod.yml itself and
      # deploy/Caddyfile; everything else is already baked into the images
      # build-and-push pushed). Copying just those two, industry-standard
      # for compose-over-SSH deploys, avoids git-on-the-VM entirely: no
      # deploy key to share across OS Login's per-identity POSIX accounts,
      # no known_hosts bootstrapping, no repo clone to keep in sync.
      #
      # Raw `gcloud compute ssh`/`scp` (not google-github-actions/ssh-compute)
      # is used directly: that action's key-parsing pipeline
      # (sshpk → PEM → Node crypto.createPublicKey) fails on ed25519 keys
      # with `error:1E08010C:DECODER routines::unsupported` — a verified
      # sshpk/Node-crypto compatibility gap — RSA works there, but calling
      # gcloud directly here sidesteps that dependency altogether and gives
      # a stable place to run scp before ssh.
      - name: Write SSH key
        env:
          SSH_KEY: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
        run: |
          umask 077
          printf '%s\n' "$SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          # gcloud compute ssh --ssh-key-file requires the matching .pub
          # file to already exist too, or it stops to interactively ask
          # whether to regenerate both (which --quiet does not suppress).
          ssh-keygen -y -f /tmp/deploy_key > /tmp/deploy_key.pub
      - name: Ensure remote directory exists
        run: |
          gcloud compute ssh ${{ vars.GCE_INSTANCE_NAME }} \
            --zone ${{ vars.GCE_ZONE }} --project ${{ vars.GCP_PROJECT_ID }} \
            --tunnel-through-iap --ssh-key-file /tmp/deploy_key --quiet \
            --command "mkdir -p /opt/marketos/deploy"
      - name: Copy compose file and Caddyfile
        run: |
          gcloud compute scp --tunnel-through-iap \
            --zone ${{ vars.GCE_ZONE }} --project ${{ vars.GCP_PROJECT_ID }} \
            --ssh-key-file /tmp/deploy_key --quiet \
            docker-compose.prod.yml ${{ vars.GCE_INSTANCE_NAME }}:/opt/marketos/docker-compose.prod.yml
          gcloud compute scp --tunnel-through-iap \
            --zone ${{ vars.GCE_ZONE }} --project ${{ vars.GCP_PROJECT_ID }} \
            --ssh-key-file /tmp/deploy_key --quiet \
            deploy/Caddyfile ${{ vars.GCE_INSTANCE_NAME }}:/opt/marketos/deploy/Caddyfile
      - name: Deploy
        run: |
          gcloud compute ssh ${{ vars.GCE_INSTANCE_NAME }} \
            --zone ${{ vars.GCE_ZONE }} --project ${{ vars.GCP_PROJECT_ID }} \
            --tunnel-through-iap --ssh-key-file /tmp/deploy_key --quiet \
            --command "cd /opt/marketos && docker compose -f docker-compose.prod.yml pull && docker compose -f docker-compose.prod.yml up -d"
      - name: Clean up SSH key
        if: always()
        run: rm -f /tmp/deploy_key /tmp/deploy_key.pub
      - name: Health check
        run: |
          sleep 15
          # --retry-all-errors is required: plain --retry does NOT retry on
          # an HTTP error response like a startup-window 502 by default,
          # only on connection-level failures (confirmed directly — a real
          # 502 during `web`'s prisma-migrate-then-boot startup window made
          # curl give up after 2 attempts instead of the intended 5).
          curl -fsS --retry 8 --retry-delay 10 --retry-all-errors --retry-connrefused \
            "https://${{ vars.PROD_DOMAIN }}" > /dev/null
